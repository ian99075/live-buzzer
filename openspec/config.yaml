schema: spec-driven

context: |
  Language: zh-TW
  文件使用繁體中文；保留 OpenSpec 結構標題及 SHALL/MUST 等規範關鍵字。
  單一課堂即時搶答系統，教師帳密登入，學生以字串學號免密碼登入。
  技術棧為 Node.js 24、JavaScript ES modules、原生 HTTP、REST 與 SSE；前端為 HTML/CSS/JavaScript，不需框架建置。
  public/ 放前端；src/ 放伺服器、routes、auth、classroom、projections、events、sheets；tests/ 使用 node:test；docs/ 放 OpenAPI 3.1 與驗收紀錄。
  無資料庫或課堂資料檔，狀態只在單一 Node 程序記憶體中，重啟清空。不得以 cluster、多副本或多實例 serverless 部署現有裁決。
  Case 1–6 是固定題號，多題獨立開放。每題每學號只保存首次有效回答；檢查與唯一第一名寫入之間不得加入 await，第一名依伺服器接受有效提交順序決定。
  教師可見全部回答；學生 API/SSE 僅提供公開題目與自身 submitted，不回傳他人學號、回答、人數、勝負或名次。
  匯出採服務帳號及 Google Sheets API，以 RAW 覆寫固定 C19–C24，每格僅 answer + "_" + studentNumber。不得加入 Apps Script、append 或任意前端指定範圍。
  環境變數以大寫底線命名；TEACHER_USERNAME、TEACHER_PASSWORD、HOST、PORT、APP_ORIGIN、COOKIE_SECURE、GOOGLE_SHEET_ID、GOOGLE_SHEET_NAME、GOOGLE_APPLICATION_CREDENTIALS 的範例見 .env.example。
  不將 .env、私鑰、存取權杖或真實密碼加入公開目錄、文件、錯誤或日誌；不覆蓋使用者既有設定。
  請求以 JSON 與明確欄位白名單驗證；HttpError 對應統一狀態碼與安全訊息。文字顯示使用 textContent。即時更新保留輸入草稿與焦點。
  npm test 使用合成資料及模擬 Google writer，不需正式憑證；必要時補實際瀏覽器驗收。只有獲授權的指定格可做真實 Google 寫入驗收，並依約還原。
  主規格在 openspec/specs/，歷史變更在 openspec/changes/archive/；後續功能建立新 change。分組、真實學籍驗證、持久化與公開部署需另行確認。

rules:
  proposal:
    - 說明問題、範圍、影響及驗收邊界，不將歷史待辦描述為目前狀態。
  specs:
    - 以可觀察行為與 WHEN/THEN 情境定義契約，保留角色隱私、固定匯出範圍與記憶體生命週期限制。
    - 新能力需完整 Purpose；主規格使用 Requirements，不保留 ADDED/MODIFIED 等差異操作標題。
  design:
    - 說明狀態、併發裁決、角色投影、失敗恢復及部署限制，目錄與最終實作一致。
    - 明確區分自動測試、瀏覽器驗收、真實 Google 寫入及未驗收的實體網路。
  tasks:
    - 每項包含可核對的完成條件，只有實作與證據齊全才勾選。
    - 中斷時更新接續紀錄，完成後保留 Verify、主規格同步與歸檔結果，不把實作完成誤稱流程全部完成。
